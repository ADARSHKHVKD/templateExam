<form #form="ngForm" (ngSubmit)="onSubmit(form)">
    
<input type="text" name="name" [(ngModel)]="user.name" #name="ngModel" placeholder="name" minlength="3" maxlength="20" required>

<div *ngIf="name.invalid && name.touched">
    <div *ngIf="name.errors?.['required']">
        name is required
    </div>
    <div *ngIf="name.errors?.['minlength']">
        name must be at least 3 chacaters long
    </div>
    <div *ngIf="name.errors?.['maxlength']">
        name cannot be longer than 20 characters
    </div>

</div>
<br><br>


<input type="email" name="email" [(ngModel)]="user.email" #email="ngModel" placeholder="email" email required>

<div *ngIf="email.invalid && email.touched">
    
    <div *ngIf="email.errors?.['required']">
       email is required
    </div>
    <div *ngIf="email.errors?.['email']">
        email is required
    </div> 

</div>
<br><br>

<input type="password" name="password" [(ngModel)]="user.password" #password="ngModel" placeholder="password" pattern="^(?=.*?[A-Z])(?=.*?[a-z])(?=.*?[0-9])(?=.*?[#?!@$%^&*-]).{8,}$" required>

<div *ngIf="password.invalid && password.touched">
    <div *ngIf="password.errors?.['required']">
        password is required
    </div> 
    <div *ngIf="password.errors?.['pattern']">
        Strong password required,must contain at least one uppercase,one lowercase,one special chacaters
    </div> 

</div>


<button type="submit" >submit</button>
<br><br>





</form>
